
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Rocket Animation</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(
        #72d2ff,
        #b7efff 65%,
        #d9f7ff
    );
}

.sun {
    position: absolute;
    top: 8%;
    right: 15%;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #ffe66d;
    box-shadow: 0 0 45px #fff4a4;
}


.cloud {
    position: absolute;
    width: 100px;
    height: 30px;
    background: white;
    border-radius: 30px;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud::before {
    width: 40px;
    height: 40px;
    left: 15px;
    top: -20px;
}

.cloud::after {
    width: 50px;
    height: 50px;
    right: 10px;
    top: -25px;
}

.cloud1 {
    top: 20%;
    left: 10%;
}

.cloud2 {
    top: 32%;
    right: 12%;
}


.mountain {
    position: absolute;
    bottom: 18%;
    width: 0;
    height: 0;
    border-left: 180px solid transparent;
    border-right: 180px solid transparent;
    border-bottom: 200px solid #a4c875;
}

.mountain1 {
    left: 10%;
}

.mountain2 {
    right: 8%;
    border-bottom-color: #83b966;
}


.rainbow {
    position: absolute;
    right: 8%;
    bottom: 15%;
    width: 320px;
    height: 160px;
    border-radius: 180px 180px 0 0;
    background: repeating-radial-gradient(
        ellipse at bottom,
        #e94d63 0 10px,
        #ff9f43 10px 20px,
        #ffe35b 20px 30px,
        #57c86a 30px 40px,
        #3ca9e8 40px 50px,
        #8b63d9 50px 60px,
        transparent 60px 70px
    );
}


.ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 22%;
    background: linear-gradient(#72c957, #399b42);
    border-radius: 50% 50% 0 0 / 15% 15% 0 0;
}


.rocket-path {
    position: absolute;
    left: 10%;
    bottom: 22%;
    width: 100px;
    height: 170px;
    animation: fly 6s linear infinite;
    z-index: 5;
}


.rocket {
    position: absolute;
    width: 60px;
    height: 110px;
    left: 15px;
    transform: rotate(42deg);
}


.nose {
    position: absolute;
    top: 0;
    left: 12px;
    width: 36px;
    height: 40px;
    background: linear-gradient(
        90deg,
        #cbd8e5,
        #ffffff,
        #b9c9da
    );
    border: 2px solid #687b91;
    border-radius: 50% 50% 5px 5px;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
}


.body {
    position: absolute;
    top: 30px;
    left: 8px;
    width: 44px;
    height: 58px;
    border: 2px solid #687b91;
    border-radius: 12px;
    background: linear-gradient(
        90deg,
        #d9e5ef,
        #ffffff,
        #cbd8e5
    );
}

.window {
    position: absolute;
    top: 42px;
    left: 19px;
    width: 23px;
    height: 23px;
    border: 4px solid #6a7f95;
    border-radius: 50%;
    background: #39bce9;
    z-index: 2;
}

.fin {
    position: absolute;
    top: 65px;
    width: 22px;
    height: 30px;
    background: #ef4b55;
    border: 2px solid #9e343b;
}

.fin-left {
    left: -2px;
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
}

.fin-right {
    right: -2px;
    clip-path: polygon(0 0, 100% 100%, 0 100%);
}

.nozzle {
    position: absolute;
    top: 85px;
    left: 19px;
    width: 23px;
    height: 15px;
    background: #8999aa;
    border-radius: 0 0 5px 5px;
}

.flame {
    position: absolute;
    top: 97px;
    left: 20px;
    width: 22px;
    height: 40px;
    background: linear-gradient(
        #fff67a,
        #ffad32,
        #ff4b36
    );
    clip-path: polygon(
        15% 0,
        85% 0,
        100% 45%,
        50% 100%,
        0 45%
    );
    transform-origin: top;
    animation: fire 0.2s infinite alternate;
}

@keyframes fly {
    0% {
        transform: translate(0, 0) rotate(-8deg) scale(.9);
    }

    25% {
        transform: translate(20vw, -15vh) rotate(5deg);
    }

    50% {
        transform: translate(40vw, -30vh) rotate(-5deg);
    }

    75% {
        transform: translate(65vw, -50vh) rotate(8deg);
    }

    100% {
        transform: translate(95vw, -75vh) rotate(15deg) scale(.6);
    }
}

@keyframes fire {
    from {
        transform: scaleY(.75);
    }

    to {
        transform: scaleY(1.2);
    }
}

@media (max-width: 600px) {
    .rainbow {
        width: 220px;
        height: 110px;
        right: 0;
    }

    .mountain {
        transform: scale(.65);
    }

    .rocket-path {
        left: 0;
        bottom: 20%;
    }
}
</style>
</head>

<body>
<div class="scene">

    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div class="rainbow"></div>

    <div class="mountain mountain1"></div>
    <div class="mountain mountain2"></div>

    <div class="ground"></div>

    <div class="rocket-path">
        <div class="rocket">

            <div class="nose"></div>
            <div class="body"></div>
            <div class="window"></div>

            <div class="fin fin-left"></div>
            <div class="fin fin-right"></div>

            <div class="nozzle"></div>
            <div class="flame"></div>

        </div>
    </div>

</div>
</body>
</html>
